# Deploys the whole app to a single-node k3s server (4 GB RAM) using the images on Docker Hub.
#
# Render / apply (the load restrictor flag lets this file reference the manifests in ../):
#   sudo k3s kubectl kustomize k8s/k3s --load-restrictor LoadRestrictionsNone | sudo k3s kubectl apply -f -
#
# The GitHub Actions workflow .github/workflows/deploy.yml replaces `newTag: latest`
# with the commit SHA so every deploy rolls out the exact image CI just pushed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../00-namespace.yaml
  - ../01-config.yaml
  - ../02-mysql.yaml
  - ../03-kafka.yaml
  - ../10-patient-service.yaml
  - ../11-doctor-service.yaml
  - ../12-appointment-service.yaml
  - ../13-billing-service.yaml
  - ../14-auth-service.yaml
  - ../15-frontend.yaml
  - ingress-traefik.yaml

images:
  - { name: patient-service,     newName: vishal29docker/patient-service,     newTag: latest }
  - { name: doctor-service,      newName: vishal29docker/doctor-service,      newTag: latest }
  - { name: appointment-service, newName: vishal29docker/appointment-service, newTag: latest }
  - { name: billing-service,     newName: vishal29docker/billing-service,     newTag: latest }
  - { name: auth-service,        newName: vishal29docker/auth-service,        newTag: latest }
  - { name: frontend,            newName: vishal29docker/frontend,            newTag: latest }

patches:
  # Spring Boot services: smaller footprint so 5 JVMs + MySQL + Kafka fit in ~3.7 GiB,
  # and a longer liveness delay because all JVMs start at once on 2 vCPUs.
  - target: { kind: Deployment, name: ".*-service" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 300Mi }
          limits: { memory: 600Mi }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: JAVA_TOOL_OPTIONS
          value: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 180
  - target: { kind: Deployment, name: mysql }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 768Mi }
  - target: { kind: Deployment, name: kafka }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 768Mi }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KAFKA_HEAP_OPTS
          value: "-Xms256m -Xmx384m"
