services:

  # =========================
  # MYSQL DATABASE
  # =========================
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    ports:
      - "3308:3306"
    networks:
      - hospital-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================
  # KAFKA (KRaft mode — no Zookeeper needed)
  # =========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - hospital-net


  # =========================
  # PATIENT SERVICE
  # =========================
  patient-service:
    build: ./patient-service
    container_name: patient-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    networks:
      - hospital-net


  # =========================
  # DOCTOR SERVICE
  # =========================
  doctor-service:
    build: ./doctor-service
    container_name: doctor-service
    depends_on:
      mysql:
        condition: service_healthy
      patient-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Feign uses this
      PATIENT_SERVICE_URL: http://patient-service:8081
    ports:
      - "8083:8083"
    networks:
      - hospital-net


  # =========================
  # APPOINTMENT SERVICE
  # =========================
  appointment-service:
    build: ./appointment-service
    container_name: appointment-service
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - hospital-net


  # =========================
  # BILLING SERVICE
  # =========================
  billing-service:
    build: ./billing-service
    container_name: billing-service
    restart: on-failure
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    networks:
      - hospital-net


  # =========================
  # AUTH SERVICE (login / register, JWT)
  # =========================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ChangeThisHospitalManagementSecretKeyToALongRandomValue123456
    ports:
      - "8086:8086"
    networks:
      - hospital-net


  # =========================
  # REACT FRONTEND (served by nginx)
  # =========================
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - patient-service
      - doctor-service
      - appointment-service
      - billing-service
      - auth-service
    ports:
      - "8082:80"
    networks:
      - hospital-net


networks:
  hospital-net:

volumes:
  mysql_data: